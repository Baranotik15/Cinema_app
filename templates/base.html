<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CinemaApp{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0a0a0a;
      --bg-card:    #141414;
      --bg-hover:   #1e1e1e;
      --accent:     #f5c518;
      --accent-dim: #c9a114;
      --text:       #e5e5e5;
      --muted:      #888;
      --border:     #2a2a2a;
      --danger:     #e74c3c;
      --success:    #2ecc71;
      --radius:     8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-dim); }

    /* NAV */
    nav {
      background: #000;
      border-bottom: 2px solid var(--accent);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .nav-logo span { color: var(--text); }
    .nav-links { display: flex; gap: 1.5rem; margin-left: auto; }
    .nav-links a {
      color: var(--muted);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 0.3rem 0;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-links a:hover,
    .nav-links a.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* LAYOUT */
    main { flex: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #111 0%, #1a1200 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--muted); font-size: 1.1rem; margin-bottom: 1.5rem; }

    /* SECTION */
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* GRID */
    .grid { display: grid; gap: 1.2rem; }
    .grid-4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

    /* CARD */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    .card-poster img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 0.9rem; }
    .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { color: var(--muted); font-size: 0.8rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-yellow { background: var(--accent); color: #000; }
    .badge-dark   { background: #2a2a2a; color: var(--muted); }
    .badge-green  { background: #1a3a1a; color: var(--success); }
    .badge-red    { background: #3a1a1a; color: var(--danger); }

    /* SESSION CARD */
    .session-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color 0.2s;
    }
    .session-card:hover { border-color: var(--accent); }
    .session-time { font-size: 1.4rem; font-weight: 800; color: var(--accent); min-width: 70px; }
    .session-info { flex: 1; }
    .session-info .title { font-weight: 600; margin-bottom: 0.2rem; }
    .session-info .meta { color: var(--muted); font-size: 0.82rem; display: flex; gap: 0.5rem; }
    .session-price { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

    /* BUTTON */
    .btn {
      display: inline-block;
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-dim); color: #000; }
    .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .btn-outline:hover { background: var(--accent); color: #000; }

    /* DETAIL PAGE */
    .movie-header {
      display: flex;
      gap: 2rem;
      margin-bottom: 2.5rem;
    }
    .movie-poster {
      width: 220px;
      min-width: 220px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-card);
      aspect-ratio: 2/3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    .movie-poster img { width: 100%; height: 100%; object-fit: cover; }
    .movie-info h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .movie-info .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.8rem 0; }
    .movie-info .description { color: var(--muted); line-height: 1.6; margin-bottom: 1rem; }
    .movie-stats { display: flex; gap: 1.5rem; margin-bottom: 1rem; }
    .stat { text-align: center; }
    .stat-value { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--muted); }

    /* SEAT MAP */
    .seat-map { margin: 1.5rem 0; }
    .screen {
      background: linear-gradient(to bottom, #333, #1a1a1a);
      height: 8px;
      border-radius: 4px;
      margin-bottom: 2rem;
      position: relative;
      text-align: center;
    }
    .screen::after {
      content: 'ЕКРАН';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 3px;
    }
    .seat-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem; }
    .row-label { width: 24px; text-align: center; color: var(--muted); font-size: 0.75rem; }
    .seat {
      width: 32px;
      height: 28px;
      border-radius: 4px 4px 0 0;
      border: 1px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      font-size: 0.65rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .seat:hover:not(.taken) { background: var(--accent); border-color: var(--accent); color: #000; }
    .seat.taken { background: #2a1a1a; border-color: #3a2a2a; color: #444; cursor: not-allowed; }
    .seat.selected { background: var(--accent); border-color: var(--accent); color: #000; }
    .seat-legend { display: flex; gap: 1.5rem; margin-top: 1rem; }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--muted); }
    .legend-dot { width: 16px; height: 14px; border-radius: 3px 3px 0 0; }

    /* BOOKING FORM */
    .booking-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.4rem; }
    .form-group input, .form-group select {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.6rem 0.8rem;
      font-size: 0.9rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .form-group select option { background: #1e1e1e; }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 0.8rem; }

    /* ALERT */
    .alert {
      padding: 0.8rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-success { background: #1a3a1a; border: 1px solid #2ecc71; color: var(--success); }
    .alert-error   { background: #3a1a1a; border: 1px solid #e74c3c; color: var(--danger); }

    /* FOOTER */
    footer {
      background: #000;
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.2rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 640px) {
      .movie-header { flex-direction: column; }
      .movie-poster { width: 100%; min-width: unset; aspect-ratio: 16/9; }
      nav { gap: 1rem; padding: 0 1rem; }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">🎬 Cinema<span>App</span></a>
    <div class="nav-links">
      <a href="/" {% if active == 'home' %}class="active"{% endif %}>Головна</a>
      <a href="/sessions" {% if active == 'sessions' %}class="active"{% endif %}>Розклад</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    &copy; 2026 CinemaApp — всі права захищені
  </footer>
</body>
</html>
